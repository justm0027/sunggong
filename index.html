<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>적자생존</title>
<meta name="theme-color" content="#f7f4ec">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="적자생존">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f7f4ec; --card:#fffdf8; --ink:#1f2420; --sub:#6b6f68; --line:#e4dfd2;
  --acc:#8a52d1; --acc2:#f1e8fb; --warn:#b5651d; --warnbg:#fbefe1; --bad:#a33b3b;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;font-size:15px;-webkit-text-size-adjust:100%}
body{background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 32px;background-attachment:fixed}
.wrap{max-width:760px;margin:0 auto;padding:16px 14px calc(90px + env(safe-area-inset-bottom))}
header.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
h1{font-size:20px;font-weight:900;margin:0;letter-spacing:-.5px}
h1 small{font-weight:500;color:var(--sub);font-size:12px;margin-left:6px}
.status{font-size:11px;color:var(--sub);background:var(--card);border:1px solid var(--line);padding:3px 8px;border-radius:99px;white-space:nowrap}
.status.cloud{color:var(--acc);border-color:#bcd3c8}
.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:14px}
.tabs button{flex:1;border:0;background:none;padding:9px 4px;border-radius:9px;font:inherit;font-weight:700;color:var(--sub);cursor:pointer}
.tabs button.on{background:var(--acc);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 0 rgba(0,0,0,.03)}
.datebar{display:flex;align-items:center;gap:6px;margin-bottom:12px}
.datebar .d{flex:1;text-align:center;font-weight:900;font-size:18px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600;padding:8px 12px;border-radius:10px;cursor:pointer;line-height:1.2}
.btn:hover{border-color:#cfc8b6}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.sm{padding:5px 9px;font-size:13px;border-radius:8px}
.btn.ghost{background:none;border-color:transparent;color:var(--sub)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.sum{display:grid;grid-template-columns:1.2fr 1fr;gap:12px;align-items:stretch}
.big{font-size:12px;color:var(--sub);font-weight:600}
.big b{display:block;font-size:30px;color:var(--acc);font-weight:900;letter-spacing:-1px;margin-top:2px;font-family:'Noto Sans KR'}
.running{background:var(--warnbg);border-radius:10px;padding:10px;font-size:13px}
.running.none{background:#f1efe8;color:var(--sub)}
.running b{font-size:15px}
.catsum{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;padding:3px 9px;border-radius:99px;background:#f1efe8;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.inbox{display:flex;gap:8px}
.inbox input{flex:1;min-width:0;font:inherit;font-size:16px;padding:12px 12px;border:2px solid var(--ink);border-radius:12px;background:#fff;outline:none}
.inbox input:focus{border-color:var(--acc)}
@keyframes pulse{50%{opacity:.6}}
.goals .g{display:flex;align-items:center;gap:12px;padding:7px 0}
.gchk{-webkit-appearance:none;appearance:none;width:32px;height:32px;flex:none;border:2px solid var(--ink);border-radius:10px;background:#fff;margin:0;cursor:pointer;position:relative}
.gchk:checked{background:var(--acc);border-color:var(--acc)}
.gchk:checked::after{content:"✓";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;font-weight:900}
.goals .gt{flex:1;min-width:0;font:inherit;font-size:17px;padding:12px 12px;border:2px solid var(--ink);border-radius:12px;background:#fff;outline:none}
.goals .gt:focus{border-color:var(--acc)}
.goals .g.done .gt{text-decoration:line-through;color:var(--sub);border-color:var(--line);background:#f1efe8}
.gcount{font-size:13px;color:var(--sub);font-weight:700}
.gcount.all{color:var(--acc)}
.hint{font-size:12px;color:var(--sub);margin-top:8px;line-height:1.6}
.hint code{font-family:inherit;background:#f1efe8;padding:1px 6px;border-radius:6px;cursor:pointer;white-space:nowrap}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:4px}
.chip{border:2px solid var(--line);background:#fff;font:inherit;font-size:18px;font-weight:700;min-height:62px;padding:14px 12px;border-radius:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.chip:active{transform:scale(.97);background:var(--acc2)}
.chip .dot{width:13px;height:13px}
.fix{display:flex;gap:6px;justify-content:flex-end;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.rec .x{border:0;background:none;color:#b9b2a2;font-size:16px;padding:2px 6px;cursor:pointer;border-radius:6px;flex:none}
.rec .x:hover{color:var(--bad);background:#f6e3e3}
.chip.end{background:var(--ink);color:#fff;border-color:var(--ink);grid-column:1/-1}
.chip .st{font-size:14px;color:var(--acc);font-weight:700}
#preview:empty{display:none}
.pv{border:2px solid var(--acc);background:var(--acc2);border-radius:14px;padding:12px;margin-top:10px}
.pv h3{margin:0 0 8px;font-size:14px}
.pv .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:7px 0}
.pv .lab{width:46px;font-size:12px;color:var(--sub);font-weight:700;flex:none}
.pv .warn{font-size:12.5px;color:var(--warn);margin:6px 0}
.pv .err{font-size:13px;color:var(--bad);font-weight:600}
.pv .close{background:#fff;border-radius:10px;padding:8px 10px;margin:8px 0;font-size:13px}
.pv .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
select,input[type=text],input[type=date],input[type=month],textarea{font:inherit;border:1px solid #cfc8b6;border-radius:8px;padding:6px 8px;background:#fff;color:var(--ink)}
.tp{display:inline-flex;align-items:center;gap:3px;font-family:var(--mono)}
.tp select{font-family:var(--mono);padding:5px 4px;font-size:15px}
.tp button{border:1px solid #cfc8b6;background:#fff;border-radius:7px;font:inherit;font-size:11px;padding:5px 5px;cursor:pointer;color:var(--sub)}
.list{margin:0;padding:0;list-style:none}
.rec{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px dashed var(--line);cursor:pointer}
.rec:last-child{border-bottom:0}
.rec .bar{width:5px;align-self:stretch;border-radius:3px;flex:none}
.rec .tm{font-family:var(--mono);font-size:14px;width:118px;flex:none}
.rec .nm{flex:1;font-weight:600;min-width:0}
.rec .nm small{font-weight:400;color:var(--sub);margin-left:4px}
.rec .du{font-size:13px;color:var(--sub);white-space:nowrap}
.tag{font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:5px;margin-left:4px;white-space:nowrap}
.tag.s{background:var(--acc2);color:var(--acc)}
.tag.o{background:var(--warnbg);color:var(--warn)}
.tag.x{background:#f6e3e3;color:var(--bad)}
.edit{background:#fbf9f3;border-radius:10px;padding:10px;margin:0 0 8px 15px;border:1px solid var(--line)}
.edit .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0}
.edit .lab{width:46px;font-size:12px;color:var(--sub);font-weight:700}
.empty{color:var(--sub);text-align:center;padding:18px 0;font-size:14px}
.tools{display:flex;flex-wrap:wrap;gap:6px}
.sec-t{font-weight:900;font-size:15px;margin:0 0 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.mstat{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.mstat div{background:#f1efe8;border-radius:10px;padding:10px 8px;text-align:center;font-size:11.5px;color:var(--sub);font-weight:600}
.mstat b{display:block;font-size:17px;color:var(--ink);margin-top:3px;font-weight:900}
.chart{display:flex;align-items:flex-end;gap:2px;height:130px;padding-top:14px;border-bottom:1px solid var(--line)}
.chart .c{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;cursor:pointer;position:relative}
.chart .c i{display:block;width:100%;background:var(--acc);border-radius:3px 3px 0 0;min-height:0}
.chart .c.today i{background:var(--ink)}
.chart .c:hover i{opacity:.75}
.chart .c span{position:absolute;top:-14px;font-size:9px;color:var(--sub);white-space:nowrap}
.xl{display:flex;gap:2px;font-size:9px;color:var(--sub);font-family:var(--mono)}
.xl span{flex:1;text-align:center}
.ctab{width:100%;border-collapse:collapse;font-size:14px}
.ctab td{padding:7px 4px;border-bottom:1px dashed var(--line)}
.ctab td.n{text-align:right;font-family:var(--mono);white-space:nowrap}
.share{height:7px;background:#eee9dc;border-radius:4px;overflow:hidden;min-width:60px}
.share i{display:block;height:100%}
.catrow{display:grid;grid-template-columns:34px 1fr auto auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.catrow input[type=color]{width:30px;height:30px;border:0;padding:0;background:none;cursor:pointer}
.catrow .al{grid-column:2/5;font-size:12px}
.catrow .al input{width:100%;font-size:12.5px}
.sw{display:inline-flex;align-items:center;gap:5px;font-size:13px;cursor:pointer;white-space:nowrap;user-select:none}
.sw input{width:17px;height:17px;accent-color:var(--acc)}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 14px;border-radius:12px;font-size:14px;display:none;align-items:center;gap:12px;z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:92vw}
#toast button{white-space:nowrap;background:none;border:1px solid #fff6;color:#fff;border-radius:8px;padding:4px 9px;font:inherit;font-size:13px;cursor:pointer}
#modal{position:fixed;inset:0;background:rgba(20,22,20,.45);display:none;align-items:flex-start;justify-content:center;z-index:40;overflow:auto;padding:30px 12px}
#modal .box{background:var(--card);border-radius:16px;padding:16px;width:100%;max-width:520px}
#modal textarea{width:100%;min-height:220px;font-family:var(--mono);font-size:13px}
#login{position:fixed;inset:0;background:var(--paper);z-index:60;display:none;align-items:center;justify-content:center;padding:20px}
#login .box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;width:100%;max-width:360px}
#login h2{margin:0 0 4px;font-size:22px;font-weight:900}
#login input{width:100%;font-size:16px;padding:11px 12px;margin-top:8px;border:1px solid #cfc8b6;border-radius:10px}
#login .btn{width:100%;margin-top:10px;padding:12px}
#login .msg{font-size:13px;color:var(--bad);min-height:18px;margin-top:8px}
#login .msg.ok{color:var(--acc)}
.linkbtn{background:none;border:0;color:var(--sub);font:inherit;font-size:13px;text-decoration:underline;cursor:pointer;padding:6px 0}
.mt{margin-top:10px}.mb0{margin-bottom:0}
.note{font-size:12px;color:var(--sub);line-height:1.6}
@media (max-width:520px){
  .chips{grid-template-columns:repeat(2,1fr)}
  .sum{grid-template-columns:1fr}
  .rec .tm{width:96px;font-size:13px}
  .mstat{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>적자생존<small>적는 자가 살아남는다</small></h1>
    <span class="status" id="status">불러오는 중…</span>
  </header>
  <nav class="tabs">
    <button data-a="tab" data-v="day" class="on">하루 기록</button>
    <button data-a="tab" data-v="month">월간 통계</button>
    <button data-a="tab" data-v="set">활동·설정</button>
  </nav>

  <section id="v-day">
    <div class="datebar">
      <button class="btn sm" data-a="dprev">◀</button>
      <div class="d" id="dlabel"></div>
      <button class="btn sm" data-a="dnext">▶</button>
      <button class="btn sm" data-a="dtoday">오늘</button>
    </div>

    <div class="card goals" id="goals"></div>

    <div class="card">
      <input id="cmd" type="hidden">
      <div id="preview"></div>
      <div class="chips" id="chips"></div>
      <div class="fix" id="fix"></div>
    </div>

    <div class="card" id="summary"></div>

    <div class="card">
      <div class="sec-t"><span>시간순 기록</span><button class="btn sm" data-a="addblank">＋ 직접 추가</button></div>
      <ul class="list" id="list"></ul>
    </div>

    <div class="card">
      <div class="tools">
        <button class="btn pri" data-a="copyday">📋 하루 기록 복사</button>
        <button class="btn" data-a="dup">📅 다른 날 기록 가져오기</button>
        <button class="btn" data-a="routine">🔁 루틴 저장·불러오기</button>
      </div>
    </div>
  </section>

  <section id="v-month" hidden></section>
  <section id="v-set" hidden></section>
</div>
<div id="login"><form class="box" id="loginForm" autocomplete="on">
  <h2>적자생존</h2>
  <p class="note" id="loginSub">폰·아이패드·맥에서 같은 기록을 보려면 로그인하세요.</p>
  <input type="email" id="lgEmail" placeholder="이메일" autocomplete="username" required>
  <input type="password" id="lgPw" placeholder="비밀번호 (6자 이상)" autocomplete="current-password" required>
  <button class="btn pri" type="submit" id="lgGo">로그인</button>
  <div class="msg" id="lgMsg"></div>
  <div style="display:flex;justify-content:space-between">
    <button type="button" class="linkbtn" id="lgMode">처음이에요 (가입하기)</button>
    <button type="button" class="linkbtn" id="lgReset">비밀번호 잊음</button>
  </div>
</form></div>
<div id="toast"></div>
<div id="modal"><div class="box" id="mbox"></div></div>

<script>
(function(){
'use strict';
/* ---------- 기본 데이터 ---------- */
const LS='sunggong-v1';
const PALETTE=['#2f6f5e','#3d5a99','#8a5a2b','#5b4b8a','#c0703a','#6b8e23','#9a9a9a','#7a8899','#b04a5a','#2b8a99','#a0812b','#7b3f6e'];
const DEF_CATS=[
  ['토익',true,['토익공부','토익 공부','toeic','공부','자습']],
  ['인강',false,['강의','인터넷강의','인터넷 강의']],
  ['독서',false,['책']],
  ['식사',false,['밥','점심','아침밥','저녁밥']],
  ['청소',false,['정리','빨래','설거지']],
  ['휴식',false,['쉬는','쉬기','쉴게','쉼']],
  ['이동',false,['출근','외출']],
  ['운동',false,['산책','헬스']],
];
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
function defaultState(){
  return {cats:DEF_CATS.map((c,i)=>({id:uid(),name:c[0],study:c[1],color:PALETTE[i%PALETTE.length],alias:c[2]})),
          routines:[],settings:{round10:false,mig1:true},days:{},goals:{}};
}
let state;
try{ state=JSON.parse(localStorage.getItem(LS)||'null'); }catch(e){ state=null; }
if(!state||!Array.isArray(state.cats)) state=defaultState();
state.days=state.days||{}; state.goals=state.goals||{}; state.routines=state.routines||[]; state.settings=state.settings||{round10:false};


/* 순공 = 토익만, '공부' 활동 제거 (1회 적용) */
function migrate(){
  if(state.settings&&state.settings.mig1) return false;
  const used=id=>Object.values(state.days).some(a=>a.some(i=>i.cat===id))||state.routines.some(r=>r.items.some(i=>i.cat===id));
  const g=state.cats.find(c=>c.name==='공부');
  if(g&&!used(g.id)) state.cats=state.cats.filter(c=>c!==g);
  state.cats.forEach(c=>{ c.study=c.name==='토익';
    if(c.name==='토익'){ c.alias=c.alias||[]; ['공부','자습'].forEach(w=>{ if(!c.alias.includes(w)) c.alias.push(w); }); }
    else if(c.alias) c.alias=c.alias.filter(w=>w!=='공부'&&w!=='자습'); });
  state.settings=state.settings||{}; state.settings.mig1=true; return true;
}
if(migrate()) saveLocal();

/* ---------- 유틸 ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const keyOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseKey=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d);};
const WD='일월화수목금토';
const dLabel=k=>{const d=parseKey(k);return (d.getMonth()+1)+'월 '+d.getDate()+'일('+WD[d.getDay()]+')';};
const fmt=m=>{const x=((m%1440)+1440)%1440;return (m>=1440?'익일 ':'')+pad(Math.floor(x/60))+':'+pad(x%60);};
const dur=m=>{m=Math.round(m);if(m<60)return m+'분';const h=Math.floor(m/60),r=m%60;return h+'시간'+(r?' '+r+'분':'');};
const rawNow=()=>{const d=new Date();return d.getHours()*60+d.getMinutes();};
const nowMin=()=>{const m=rawNow();return state.settings.round10?Math.round(m/10)*10:m;};
const catById=id=>state.cats.find(c=>c.id===id);
const catName=id=>(catById(id)||{name:'(삭제된 활동)'}).name;
const catColor=id=>(catById(id)||{color:'#bbb'}).color;
const isStudy=id=>!!(catById(id)||{}).study;
const fixEnd=(s,e)=>{e=((e%1440)+1440)%1440;let b=s>=1440?1440:0;let v=e+b;if(v<s)v+=1440;return v;};
const todayKey=()=>keyOf(new Date());
let cur=todayKey();
const items=k=>(state.days[k||cur]||(state.days[k||cur]=[]));
const sortItems=k=>items(k).sort((a,b)=>a.s-b.s);

function unionLen(iv){
  iv=iv.filter(x=>x[1]>x[0]).sort((a,b)=>a[0]-b[0]);let t=0,cs=-1,ce=-1;
  for(const [s,e] of iv){ if(s>ce){ if(ce>cs)t+=ce-cs; cs=s;ce=e;} else if(e>ce) ce=e; }
  if(ce>cs)t+=ce-cs; return t;
}
function dayStats(list){
  const closed=list.filter(i=>i.e!=null&&i.e>i.s);
  const by={};closed.forEach(i=>{(by[i.cat]=by[i.cat]||[]).push([i.s,i.e]);});
  const catMin={};for(const k in by)catMin[k]=unionLen(by[k]);
  const study=unionLen(closed.filter(i=>isStudy(i.cat)).map(i=>[i.s,i.e]));
  const all=unionLen(closed.map(i=>[i.s,i.e]));
  const overlap=new Set();
  for(let a=0;a<closed.length;a++)for(let b=a+1;b<closed.length;b++){
    const x=closed[a],y=closed[b]; if(x.s<y.e&&y.s<x.e){overlap.add(x.id);overlap.add(y.id);}
  }
  return {study,catMin,all,open:list.filter(i=>i.e==null),overlap};
}

/* ---------- 저장 (이 기기 + 계정 DB) ---------- */
const hasGoal=g=>Array.isArray(g)&&g.some(x=>x&&(x.t||x.d));
function saveLocal(){ try{localStorage.setItem(LS,JSON.stringify(state));}catch(e){} }
let col=null, remoteReady=false, dbTimer=null;
const W={};
function setStatus(kind,msg){ const s=$('#status'); s.className='status'+(kind==='cloud'?' cloud':''); s.textContent=msg; }
function commit(keys){
  saveLocal();
  (keys||[]).forEach(queueWrite);
}
const dayDoc=k=>'d-'+k;
function queueWrite(key){
  if(!col) return; const w=W[key]||(W[key]={}); w.pending=true; clearTimeout(w.t); w.t=setTimeout(()=>flush(key),400);
}
function bodyOf(key){
  if(key==='meta') return {cats:state.cats,routines:state.routines,settings:state.settings,v:1};
  const dk=key.slice(2); return {items:state.days[dk]||[],goals:state.goals[dk]||[]};
}
async function flush(key){
  const w=W[key]; w.t=null; if(w.busy){w.again=true;return;}
  w.busy=true;
  try{ await col.doc(key).set(JSON.parse(JSON.stringify(bodyOf(key)))); setStatus('cloud','☁ 계정에 저장됨'); }
  catch(e){
    if(e&&e.code==='unavailable'){ setTimeout(()=>queueWrite(key),1500+Math.random()*1000); }
    else if(e&&e.code==='quota_exceeded'){ setStatus('', '저장 공간 가득 참 — 이 기기에만 저장'); }
    else { setStatus('', '이 기기에만 저장 중'); }
  }
  w.busy=false;
  if(w.again){w.again=false;flush(key);} else if(!w.t) w.pending=false;
}
const isPending=key=>!!(W[key]&&(W[key].pending||W[key].busy));
function hasLocalData(){ return Object.values(state.days).some(a=>a&&a.length)||Object.values(state.goals).some(hasGoal)||state.routines.length; }
function pushAll(){ queueWrite('meta'); new Set([...Object.keys(state.days),...Object.keys(state.goals)]).forEach(k=>{ if((state.days[k]&&state.days[k].length)||hasGoal(state.goals[k])) queueWrite(dayDoc(k)); }); }
function applySnap(snap){
  const real=!snap.metadata.fromCache;
  if(real){ clearTimeout(dbTimer); }
  if(real&&!remoteReady){
    remoteReady=true;
    const ids=new Set(snap.docs.map(d=>d.id));
    if(snap.empty){ if(hasLocalData()) pushAll(); else queueWrite('meta'); setStatus('cloud','☁ 계정에 저장됨'); return; }
    if(!ids.has('meta')) queueWrite('meta');
    new Set([...Object.keys(state.days),...Object.keys(state.goals)]).forEach(k=>{ if(((state.days[k]&&state.days[k].length)||hasGoal(state.goals[k]))&&!ids.has(dayDoc(k))) queueWrite(dayDoc(k)); });
    setStatus('cloud','☁ 계정에 저장됨');
  }
  let changed=false;
  snap.docs.forEach(doc=>{
    const id=doc.id; if(isPending(id)) return; const d=doc.data()||{};
    if(id==='meta'){
      if(Array.isArray(d.cats)&&d.cats.length){
        const nb={cats:d.cats,routines:d.routines||[],settings:d.settings||{round10:false}};
        const ob={cats:state.cats,routines:state.routines,settings:state.settings};
        if(JSON.stringify(nb)!==JSON.stringify(ob)){ Object.assign(state,JSON.parse(JSON.stringify(nb))); changed=true; }
      }
    } else if(id.startsWith('d-')){
      const k=id.slice(2), its=Array.isArray(d.items)?d.items:[];
      if(JSON.stringify(its)!==JSON.stringify(state.days[k]||[])){ state.days[k]=JSON.parse(JSON.stringify(its)); changed=true; }
      const gl=Array.isArray(d.goals)?d.goals:[];
      if(JSON.stringify(gl)!==JSON.stringify(state.goals[k]||[])){ if(gl.length) state.goals[k]=JSON.parse(JSON.stringify(gl)); else delete state.goals[k]; changed=true; }
    }
  });
  if(migrate()){ changed=true; queueWrite('meta'); }
  if(changed){ saveLocal(); renderAll(); }
}
let unsub=null, account=null;
function attachSync(adapter){
  detachSync(); col=adapter; remoteReady=false;
  setStatus('','연결 중…');
  dbTimer=setTimeout(()=>setStatus('','오프라인 — 연결되면 자동 동기화'),10000);
  unsub=adapter.onSnapshot(applySnap,e=>{ clearTimeout(dbTimer); setStatus('','동기화 오류 — 이 기기에 저장 중'); });
}
function detachSync(){ if(unsub){ try{unsub();}catch(e){} unsub=null; } col=null; remoteReady=false; clearTimeout(dbTimer); }
function resetLocal(){ state=defaultState(); undos.length=0; saveLocal(); renderAll(); }

/* ---------- 문장 해석 ---------- */
const HW={'열두':12,'열한':11,'열':10,'아홉':9,'여덟':8,'일곱':7,'여섯':6,'다섯':5,'네':4,'세':3,'두':2,'한':1};
const SD={'일':1,'이':2,'삼':3,'사':4,'오':5,'육':6,'칠':7,'팔':8,'구':9};
function normKo(t){
  t=t.replace(/[。．.!?！？,，]/g,' ').replace(/\s+/g,' ').trim();
  t=t.replace(/(열\s?두|열\s?한|열|아홉|여덟|일곱|여섯|다섯|네|세|두|한)\s*시간/g,(m,w)=>HW[w.replace(/\s/g,'')]+'시간');
  t=t.replace(/(열\s?두|열\s?한|열|아홉|여덟|일곱|여섯|다섯|네|세|두|한)\s*시(?![작간])/g,(m,w)=>HW[w.replace(/\s/g,'')]+'시');
  t=t.replace(/(오십|사십|삼십|이십|십)\s*(일|이|삼|사|오|육|칠|팔|구)?\s*분/g,(m,a,b)=>({'오십':50,'사십':40,'삼십':30,'이십':20,'십':10}[a]+(b?SD[b]:0))+'분');
  t=t.replace(/(\d+\s*시)\s*(일|이|삼|사|오|육|칠|팔|구)\s*분/g,(m,a,b)=>a+' '+SD[b]+'분');
  t=t.replace(/(\d+)\s*시\s*반/g,'$1시 30분');
  t=t.replace(/(\d+)\s*시간\s*반/g,(m,h)=>(h*60+30)+'분');
  return t;
}
function resolveHour(h,m,p,now){
  if(h>24||m>59) return null;
  if(p){
    if(/오후|저녁|밤/.test(p)) return ((h<12?h+12:h)%24)*60+m;
    if(/낮|점심/.test(p)) return ((h<=6?h+12:h)%24)*60+m;
    if(/오전|아침|새벽/.test(p)) return (h===12?0:h)*60+m;
  }
  if(h===24) return 0;
  if(h>=13||h===0) return h*60+m;
  if(h===12) return 12*60+m;
  const a=h*60+m,b=(h+12)*60+m;
  const sc=c=>c<=now+30?now-c:(c-now)*3;
  return Math.abs(sc(a))<=Math.abs(sc(b))?a:b;
}
function findCat(text){
  const pairs=[];
  state.cats.forEach(c=>{ pairs.push([c.name,c]); (c.alias||[]).forEach(a=>{ if(a&&a.trim()) pairs.push([a.trim(),c]); }); });
  pairs.sort((x,y)=>y[0].length-x[0].length);
  const low=text.toLowerCase(); let best=null;
  for(const [w,c] of pairs){ const i=low.indexOf(w.toLowerCase()); if(i>=0&&(!best||i<best.i||(i===best.i&&w.length>best.w.length))) best={i,w,c}; }
  return best?best.c:null;
}
const END_RE=/(끝|종료|마침|마쳤|마치|마무리|그만|스톱|stop)/i;
const START_RE=/(시작|스타트|start)/i;
const PAST_RE=/(아까|사실|실은|정정|수정|고쳐|잘못|끝났|끝냈|마쳤|시작했)/;
function leftover(t){
  const STOP=new Set(['지금','이제','아까','사실','실은','그리고','그럼','좀','다시','오늘','정정','수정','저','나','내가','난']);
  return t.replace(/⟦\d+⟧/g,' ').split(/\s+/).map(w=>{
    let p;do{p=w;w=w.replace(/(시작\S*|끝\S*|종료\S*|부터|에서|까지|하기|하고|하자|할게요?|합니다|해요?|했어요?|했음|중|을|를|은|는|이|가|에|도|요)$/,'');}while(w&&w!==p);
    return w;
  }).filter(w=>w&&!STOP.has(w)&&!/^[~\-–]+$/.test(w)).join(' ').slice(0,12).trim();
}
function parse(raw){
  const now=nowMin(); let t=normKo(raw); if(!t) return null;
  const T=[]; const put=(min,x)=>{ if(min==null) return ' '; T.push(Object.assign({min:((min%1440)+1440)%1440},x||{})); return ' ⟦'+(T.length-1)+'⟧ '; };
  t=t.replace(/(\d+)\s*시간\s*(?:(\d+)\s*분\s*)?전에?/g,(_,h,m)=>put(now-(h*60+(+m||0)),{rel:1}));
  t=t.replace(/(\d+)\s*분\s*전에?/g,(_,m)=>put(now-m,{rel:1}));
  t=t.replace(/(오전|오후|아침|낮|점심|저녁|밤|새벽)?\s*(\d{1,2})\s*(?::\s*(\d{2})|시(?![작간])\s*(?:(\d{1,2})\s*분)?)/g,(_,p,h,m1,m2)=>put(resolveHour(+h,+(m1||m2||0),p,now)));
  t=t.replace(/(방금|지금)/g,()=>put(now,{rel:1,nw:1}));
  // 역할(시작/끝) 판별
  T.forEach((x,i)=>{
    const after=t.slice(t.indexOf('⟦'+i+'⟧')+3+String(i).length);
    if(/^\s*(부터|에서)/.test(after)) x.role='s';
    else if(/^\s*까지/.test(after)) x.role='e';
    else if(/^\s*[~\-–]\s*⟦/.test(after)) x.role='s';
    else if(/^\s*에?\s*(끝|종료|마침|마쳤|마치|그만)/.test(after)) x.role='e';
    else if(/^\s*에?\s*시작/.test(after)) x.role='s';
  });
  T.forEach((x,i)=>{ if(!x.role&&i>0&&T[i-1].role==='s'&&/[~\-–]\s*⟦\d+⟧\s*$/.test(t.slice(0,t.indexOf('⟦'+i+'⟧')+3+String(i).length))) x.role='e'; });
  const plain=t.replace(/⟦\d+⟧/g,' ');
  const isEnd=END_RE.test(plain), isStart=START_RE.test(plain), past=PAST_RE.test(plain);
  const real=T.filter(x=>!x.nw||T.length===1);
  const sT=real.find(x=>x.role==='s'), eT=real.find(x=>x.role==='e');
  let kind;
  if((sT&&eT)||(real.length>=2&&!(isEnd&&isStart))) kind='range';
  else if(isEnd&&isStart) kind='start';
  else if(isEnd) kind='end';
  else kind='start';
  // 활동 찾기 (끝+시작 복합 문장은 '끝' 뒤쪽에서 찾음)
  let seg=t;
  if(isEnd&&isStart){ const m=[...t.matchAll(new RegExp(END_RE.source,'gi'))]; const last=m[m.length-1]; if(last) seg=t.slice(last.index); }
  let cat=findCat(seg.replace(/⟦\d+⟧/g,' '))||(seg!==t?null:null);
  let newName='';
  if(!cat&&kind!=='end'){ newName=leftover(seg); }
  const its=items(); const running=its.filter(i=>i.e==null).sort((a,b)=>b.s-a.s);
  const P={raw,kind,cat:cat?cat.id:null,newName,newStudy:false,warn:[]};
  if(kind==='range'){
    const a=sT||real[0], b=eT||real.find(x=>x!==a);
    P.s=a?a.min:now; P.e=b?b.min:now;
    if(running.length&&running[0].s<=P.s&&running[0].cat!==P.cat) P.close={id:running[0].id,at:P.s,on:false};
  } else if(kind==='start'){
    const tt=sT||real.find(x=>x.role!=='e')||real[0];
    P.s=tt?tt.min:now;
    const same=P.cat&&running.find(r=>r.cat===P.cat);
    if(same&&past&&!isEnd){ P.kind='editStart'; P.target=same.id; }
    else if(running.length){
      const r=running[0];
      if(same&&same===r) P.warn.push(catName(r.cat)+'이(가) 이미 '+fmt(r.s)+'부터 진행 중이에요. 새로 시작하면 앞 기록은 종료돼요.');
      P.close={id:r.id,at:Math.max(P.s,r.s),on:true};
      if(isEnd&&eT) P.close.at=eT.min;
      if(running.length>1) P.warn.push('그 밖에 진행 중: '+running.slice(1).map(x=>catName(x.cat)+' '+fmt(x.s)+'~').join(', '));
    }
  } else { // end
    const tt=eT||real[0];
    P.e=tt?tt.min:now;
    const match=i=>!P.cat||i.cat===P.cat||(catName(P.cat)==='공부'&&isStudy(i.cat));
    const fits=i=>!tt||i.s<=P.e;   // 말한 종료 시각보다 먼저 시작한 기록만 대상
    let target=running.filter(match).filter(fits).sort((a,b)=>(P.cat&&b.cat===P.cat)-(P.cat&&a.cat===P.cat)||b.s-a.s)[0]||null;
    if(target){ P.kind='end'; P.target=target.id; }
    else {
      const done=its.filter(i=>i.e!=null&&match(i)&&fits(i)).sort((a,b)=>b.s-a.s);
      if(done.length&&(tt||past)){ P.kind='editEnd'; P.target=done[0].id; }
      else { P.kind='none'; P.err= running.length? '"'+(P.cat?catName(P.cat):'')+'" 진행 중인 기록이 없어요.' : '지금 진행 중인 활동이 없어요. 시작 시각부터 입력해 주세요.'; }
    }
  }
  return P;
}

/* ---------- 시간 선택기 (10분 단위) ---------- */
function tpHTML(key,val){
  val=((val%1440)+1440)%1440; const h=Math.floor(val/60), m=val%60;
  let hs='',ms='';
  for(let i=0;i<24;i++) hs+='<option value="'+i+'"'+(i===h?' selected':'')+'>'+pad(i)+'</option>';
  const mins=[0,10,20,30,40,50]; if(!mins.includes(m)) {mins.push(m); mins.sort((a,b)=>a-b);}
  mins.forEach(x=>ms+='<option value="'+x+'"'+(x===m?' selected':'')+'>'+pad(x)+'</option>');
  return '<span class="tp" data-tp="'+key+'" data-v="'+val+'"><button type="button" data-step="-10">−10</button><select data-part="h">'+hs+'</select>:<select data-part="m">'+ms+'</select><button type="button" data-step="10">+10</button></span>';
}
function tpRead(el){ return (+el.querySelector('[data-part=h]').value)*60+(+el.querySelector('[data-part=m]').value); }

let P=null;
function catOptions(sel,newName){
  let o='<option value="">활동 선택…</option>';
  state.cats.forEach(c=>o+='<option value="'+c.id+'"'+(c.id===sel?' selected':'')+'>'+esc(c.name)+(c.study?' ★':'')+'</option>');
  if(newName) o+='<option value="__new"'+(!sel?' selected':'')+'>＋ 새 활동 "'+esc(newName)+'"</option>';
  return o;
}

  if(!P){ box.innerHTML=''; return; }

  let h='<div class="pv">';
  const isNewSel=!P.cat&&P.newName;

  const title={start:'저장될 내용 · 시작',range:'저장될 내용 · 기록 추가',end:'저장될 내용 · 종료',editEnd:'저장될 내용 · 종료 시각 수정',editStart:'저장될 내용 · 시작 시각 수정'}[P.kind];

    else h+='<div class="row"><span class="lab">종료</span><span class="note">진행 중 (다음 활동을 누르면 자동 종료)</span></div>';
    if(P.close){ const r=find(P.close.id); if(r){

        tpHTML('p-c',P.close.at)+'<div class="note">체크를 풀면 앞 활동은 계속 진행 중으로 남아요.</div></div>';
    }}
  } else {
    const r=find(P.target);
    if(r){
      h+='<div class="row"><span class="lab">대상</span><b>'+esc(catName(r.cat))+'</b>&nbsp;<span class="note">'+fmt(r.s)+'~'+(r.e!=null?fmt(r.e):'')+'</span></div>';
      if(P.kind==='editStart') h+='<div class="row"><span class="lab">새 시작</span>'+tpHTML('p-s',P.s)+'</div>';
      else h+='<div class="row"><span class="lab">종료</span>'+tpHTML('p-e',P.e)+' <span class="note">'+dur(fixEnd(r.s,P.e)-r.s)+'</span></div>';
    }
  }
  P.warn.forEach(w=>h+='<div class="warn">⚠ '+esc(w)+'</div>');

  h+='<div class="acts"><button class="btn" data-a="pcancel">취소</button><button class="btn pri" data-a="psave"'+(ok?'':' disabled')+'>저장 (Enter)</button></div></div>';
  box.innerHTML=h;

/* 이어진 기록 맞추기: 시작을 바꾸면 바로 앞 기록의 종료도, 종료를 바꾸면 바로 뒤 기록의 시작도 함께 */
function linkStart(r,oldS){
  if(r.s===oldS) return;
  items().forEach(o=>{ if(o===r||o.e==null||o.s>=r.s) return;
    if(o.e===oldS||(o.e>r.s&&o.e<=oldS)) o.e=r.s; });
}
function linkEnd(r,oldE){
  if(r.e==null||oldE==null||r.e===oldE) return;
  items().forEach(o=>{ if(o===r||o.s!==oldE||o.s<=r.s) return;
    if(o.e==null||r.e<o.e) o.s=r.e; });
}
const undos=[];
function snapshotDay(){ undos.push({k:cur,items:JSON.parse(JSON.stringify(items())),cats:JSON.parse(JSON.stringify(state.cats))}); if(undos.length>30) undos.shift(); }
function savePreview(){
  if(!P||P.kind==='none') return;
  const its=items(); const find=id=>its.find(i=>i.id===id);
  if((P.kind==='start'||P.kind==='range')&&!P.cat){
    if(!P.newName) return;
    let c=state.cats.find(x=>x.name===P.newName);
    snapshotDay();
    if(!c){ c={id:uid(),name:P.newName,study:!!P.newStudy,color:PALETTE[state.cats.length%PALETTE.length],alias:[]}; state.cats.push(c); }
    P.cat=c.id; commit(['meta']);
  } else snapshotDay();
  let msg='';
  if(P.kind==='start'){
    if(P.close&&P.close.on){ const r=find(P.close.id); if(r){ r.e=fixEnd(r.s,P.close.at); msg=catName(r.cat)+' '+fmt(r.e)+' 종료 · '; } }
    its.push({id:uid(),s:P.s,e:null,cat:P.cat}); msg+=fmt(P.s)+' '+catName(P.cat)+' 시작';
  } else if(P.kind==='range'){
    if(P.close&&P.close.on){ const r=find(P.close.id); if(r) r.e=fixEnd(r.s,P.close.at); }
    its.push({id:uid(),s:P.s,e:fixEnd(P.s,P.e),cat:P.cat}); msg=fmt(P.s)+'~'+fmt(P.e)+' '+catName(P.cat)+' 추가';
  } else if(P.kind==='end'||P.kind==='editEnd'){
    const r=find(P.target); if(r){ const oe=r.e; r.e=fixEnd(r.s,P.e); linkEnd(r,oe); msg=catName(r.cat)+' '+fmt(r.e)+' 종료'+(P.kind==='editEnd'?'로 수정':''); }
  } else if(P.kind==='editStart'){

  if(sc.length) out.push('  '+sc.map(x=>catName(x)+' '+dur(st.catMin[x])).join(' · '));

let curMonth=cur.slice(0,7);
function monthData(ym){
  const [y,m]=ym.split('-').map(Number); const n=new Date(y,m,0).getDate();
  const days=[]; const cat={}; let total=0, rec=0, best=null, openCnt=0;
  for(let d=1;d<=n;d++){
    const k=ym+'-'+pad(d); const its=state.days[k]||[]; const st=dayStats(its);
    if(its.length) rec++;
    openCnt+=st.open.length;
    for(const c in st.catMin) cat[c]=(cat[c]||0)+st.catMin[c];
    total+=st.study; days.push({k,d,study:st.study});
    if(!best||st.study>best.study) best={k,study:st.study};
  }
  return {days,cat,total,rec,best,openCnt,n};
}

  h+='<div class="card"><div class="sec-t">백업</div><p class="note">기록은 자동 저장·동기화돼요. 이전 기록표(Claude)의 ‘백업 내용 복사’를 아래에 붙여넣으면 그대로 옮겨져요. 혹시 몰라 가끔 백업을 복사해 메모장에 붙여 두세요.</p>'+
    '<div class="tools"><button class="btn" data-a="bkcopy">백업 내용 복사</button></div>'+
    '<textarea id="bkin" placeholder="백업 내용을 여기에 붙여넣고 ‘복원’을 누르세요" style="width:100%;min-height:80px;margin-top:10px"></textarea>'+
    '<div style="text-align:right;margin-top:6px"><button class="btn danger" data-a="bkload">'+(confirmImport?'정말 덮어쓸까요? 한 번 더 누르기':'복원 (현재 기록 덮어씀)')+'</button></div></div>';
  $('#v-set').innerHTML=h;
}

/* ---------- 토스트 ---------- */
let tt=null;
function toast(msg,undo){
  const t=$('#toast'); t.innerHTML='<span>'+esc(msg)+'</span>'+(undo&&undos.length?'<button data-a="undo">되돌리기</button>':''); t.style.display='flex';
  clearTimeout(tt); tt=setTimeout(()=>t.style.display='none',undo?6000:2500);
}

/* ---------- 탭 ---------- */
let tab='day';
function renderAll(){ if(tab==='day'){ renderDay(); renderPreview(); } else if(tab==='month') renderMonth(); else renderSet(); }
function setTab(v){
  tab=v; document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  ['day','month','set'].forEach(x=>$('#v-'+x).hidden=x!==v); renderAll();
}

/* ---------- 이벤트 ---------- */
const cmd=$('#cmd'); let pt=null;
cmd.addEventListener('input',()=>{ clearTimeout(pt); pt=setTimeout(()=>{ P=cmd.value.trim()?parse(cmd.value):null; renderPreview(); },250); });
cmd.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.isComposing){ e.preventDefault(); clearTimeout(pt); if(cmd.value.trim()){ P=parse(cmd.value); renderPreview(); }
    const ok=P&&P.kind!=='none'&&((P.kind!=='start'&&P.kind!=='range')||P.cat||P.newName); if(ok) savePreview(); }
  if(e.key==='Escape'){ P=null; cmd.value=''; renderPreview(); }
});
document.addEventListener('click',e=>{
  const st=e.target.closest('.tp [data-step]');
  if(st){ const tp=st.closest('.tp'); let v=tpRead(tp)+(+st.dataset.step); v=((v%1440)+1440)%1440; tp.outerHTML=tpHTML(tp.dataset.tp,v); onPick(tp.dataset.tp,v); return; }
  const c=e.target.closest('.hint code'); if(c){ cmd.value=c.textContent; P=parse(cmd.value); renderPreview(); cmd.focus(); return; }
  const b=e.target.closest('[data-a]'); if(!b) return;
  if(b.tagName==='SELECT'||(b.tagName==='INPUT'&&b.type!=='button')) return;
  const a=b.dataset.a, v=b.dataset.v;
  switch(a){
    case 'tab': setTab(v); break;
    case 'dprev': case 'dnext': { const d=parseKey(cur); d.setDate(d.getDate()+(a==='dprev'?-1:1)); cur=keyOf(d); P=null; openRow=null; renderDay(); renderPreview(); break; }
    case 'dtoday': cur=todayKey(); P=null; openRow=null; renderDay(); renderPreview(); break;
    case 'pcancel': P=null; cmd.value=''; renderPreview(); break;
    case 'psave': savePreview(); break;
    case 'qs': quickStart(v); break;
    case 'qe': quickEnd(v); break;
    case 'row': openRow=openRow===v?null:v; renderList(); break;
    case 'rdel': { const r=items().find(i=>i.id===v); if(!r) break; snapshotDay(); state.days[cur]=items().filter(i=>i.id!==v); openRow=null; commit([dayDoc(cur)]); renderDay(); toast(fmt(r.s)+' '+catName(r.cat)+' 삭제',true); break; }
    case 'dellast': { const its=items(); if(!its.length) break; const r=its.reduce((a,b)=>b.s>=a.s?b:a);
      snapshotDay(); state.days[cur]=its.filter(i=>i!==r);
      if(r.e==null){ /* 방금 시작한 걸 지우면, 그때 자동 종료된 앞 활동을 다시 진행 중으로 */ const prev=state.days[cur].filter(i=>i.e!=null&&i.e===r.s).reduce((a,b)=>(!a||b.s>=a.s)?b:a,null); if(prev&&!state.days[cur].some(i=>i.e==null)) prev.e=null; }
      openRow=null; commit([dayDoc(cur)]); renderDay(); toast(fmt(r.s)+' '+catName(r.cat)+' 삭제',true); break; }
    case 'rsetend': { const r=items().find(i=>i.id===v); if(r){ snapshotDay(); r.e=fixEnd(r.s,cur===todayKey()?Math.max(nowMin(),r.s):r.s+60); commit([dayDoc(cur)]); renderDay(); } break; }
    case 'ropen': { const r=items().find(i=>i.id===v); if(r){ snapshotDay(); r.e=null; commit([dayDoc(cur)]); renderDay(); } break; }
    case 'addblank': { const n=nowMin(); P={raw:'',kind:'range',cat:null,newName:'',warn:[],s:Math.max(0,Math.floor(n/10)*10-60),e:Math.floor(n/10)*10}; renderPreview(); $('#preview').scrollIntoView({block:'nearest',behavior:'smooth'}); break; }
    case 'copyday': copyText(dayText(cur),'하루 기록 복사'); break;
    case 'dup': openDup(); break;
    case 'dupgo': { const k=$('#dupdate').value; const src=state.days[k]||[]; if(!src.length){ toast('그날은 기록이 없어요'); break; } if(k===cur&&!$('#dupover').checked){ toast('같은 날짜예요'); break; } addItemsTo(JSON.parse(JSON.stringify(src)),$('#dupover').checked); break; }
    case 'routine': openRoutine(); break;
    case 'rtsave': { const nm=$('#rtname').value.trim()||('루틴 '+(state.routines.length+1)); const src=items(); if(!src.length){ toast('저장할 기록이 없어요'); break; }
      state.routines.push({id:uid(),name:nm,items:src.map(i=>({s:i.s,e:i.e,cat:i.cat}))}); commit(['meta']); openRoutine(); toast('루틴 "'+nm+'" 저장'); break; }
    case 'rtapply': { const r=state.routines.find(x=>x.id===v); if(r) addItemsTo(r.items,false); break; }
    case 'rtdel': state.routines=state.routines.filter(x=>x.id!==v); commit(['meta']); openRoutine(); break;
    case 'mclose': closeModal(); break;
    case 'logout': if(account&&account.logout) account.logout(); break;
    case 'undo': { const u=undos.pop(); if(u){ state.days[u.k]=u.items; state.cats=u.cats; commit([dayDoc(u.k),'meta']); if(u.k!==cur){ cur=u.k; } openRow=null; renderAll(); toast('되돌렸어요'+(undos.length?' (더 되돌리기 가능 '+undos.length+'번)':'')); } break; }
    case 'mprev': case 'mnext': { const [y,m]=curMonth.split('-').map(Number); const d=new Date(y,m-1+(a==='mprev'?-1:1),1); curMonth=d.getFullYear()+'-'+pad(d.getMonth()+1); renderMonth(); break; }
    case 'mcopy': copyText(monthText(),'월간 통계 복사'); break;
    case 'goday': cur=v; setTab('day'); break;
    case 'cadd': { const nm=$('#newcat').value.trim(); if(!nm) break; if(state.cats.some(c=>c.name===nm)){ toast('이미 있는 활동이에요'); break; }
      state.cats.push({id:uid(),name:nm,study:$('#newcatstudy').checked,color:PALETTE[state.cats.length%PALETTE.length],alias:[]}); commit(['meta']); renderSet(); break; }
    case 'cdel': { const used=Object.values(state.days).some(a=>a.some(i=>i.cat===v))||state.routines.some(r=>r.items.some(i=>i.cat===v));
      if(used){ toast('기록에 쓰인 활동은 삭제할 수 없어요 (이름은 바꿀 수 있어요)'); break; }
      state.cats=state.cats.filter(c=>c.id!==v); commit(['meta']); renderSet(); break; }
    case 'bkcopy': copyText(JSON.stringify(state),'백업 복사'); break;
    case 'bkload': {
      const txt=$('#bkin').value.trim(); if(!txt){ toast('백업 내용을 붙여넣어 주세요'); break; }
      let d; try{ d=JSON.parse(txt); }catch(err){ toast('백업 형식이 아니에요'); break; }
      if(!d||!Array.isArray(d.cats)||typeof d.days!=='object'){ toast('백업 형식이 아니에요'); break; }
      if(!confirmImport){ confirmImport=true; renderSet(); $('#bkin').value=txt; break; }
      confirmImport=false; const old=[...Object.keys(state.days),...Object.keys(state.goals)];
      state={cats:d.cats,routines:d.routines||[],settings:d.settings||{round10:false},days:d.days,goals:d.goals||{}};
      commit(['meta',...new Set([...old,...Object.keys(state.days),...Object.keys(state.goals)])].map(k=>k==='meta'?k:dayDoc(k)));
      renderSet(); toast('복원했어요'); break; }
  }
});
document.addEventListener('input',e=>{ const el=e.target; if(el.dataset&&el.dataset.a==='gtext'){ clearTimeout(gt); gt=setTimeout(()=>saveGoalText(el),600); } });
document.addEventListener('keydown',e=>{ const el=e.target; if(el.dataset&&el.dataset.a==='gtext'&&e.key==='Enter'&&!e.isComposing){ e.preventDefault(); const nx=el.closest('.g').nextElementSibling; const nt=nx&&nx.querySelector('.gt'); if(nt) nt.focus(); else el.blur(); } });
window.addEventListener('pagehide',flushGoal); document.addEventListener('visibilitychange',()=>{ if(document.hidden) flushGoal(); });
document.addEventListener('change',e=>{
  const el=e.target;
  const tp=el.closest('.tp'); if(tp){ onPick(tp.dataset.tp,tpRead(tp)); return; }
  const a=el.dataset.a, v=el.dataset.v; if(!a) return;
  const c=v&&catById(v);
  switch(a){
    case 'pcat': if(!P) break; P.cat=el.value&&el.value!=='__new'?el.value:null; renderPreview(); break;
    case 'pnewstudy': if(P) P.newStudy=el.checked; break;
    case 'pclose': if(P&&P.close) P.close.on=el.checked; break;
    case 'rcat': { const r=items().find(i=>i.id===v); if(r&&el.value){ snapshotDay(); r.cat=el.value; commit([dayDoc(cur)]); renderDay(); } break; }
    case 'gdone': { const k=el.dataset.k,i=+v; const ti=el.closest('.g').querySelector('.gt'); clearTimeout(gt); saveGoalText(ti);
      if(!ti.value.trim()){ el.checked=false; toast('목표를 먼저 적어 주세요'); break; }
      setGoal(k,i,{d:el.checked}); el.closest('.g').classList.toggle('done',el.checked); if(goalHead(k)===3) toast('🎉 오늘 목표 3개 모두 달성!'); break; }
    case 'gtext': clearTimeout(gt); saveGoalText(el); break;
    case 'rmemo': { const r=items().find(i=>i.id===v); if(r){ r.memo=el.value.trim(); commit([dayDoc(cur)]); renderList(); } break; }
    case 'ccolor': if(c){ c.color=el.value; commit(['meta']); } break;
    case 'cname': if(c&&el.value.trim()){ c.name=el.value.trim(); commit(['meta']); } break;
    case 'cstudy': if(c){ c.study=el.checked; commit(['meta']); } break;
    case 'calias': if(c){ c.alias=el.value.split(/[,，]/).map(s=>s.trim()).filter(Boolean); commit(['meta']); } break;
    case 'round10': state.settings.round10=el.checked; commit(['meta']); break;
    case 'dupdate': { const p=$('#dupprev'); if(p) p.innerHTML=itemsSummary(state.days[el.value]||[]); break; }
  }
});
function onPick(key,val){
  if(key==='p-s'&&P){ P.s=val; renderPreview(); }
  else if(key==='p-e'&&P){ P.e=val; renderPreview(); }
  else if(key==='p-c'&&P&&P.close){ P.close.at=val; }
  else if(key.startsWith('r-')){
    const [k,id]=key.split(':'); const r=items().find(i=>i.id===id); if(!r) return;
    snapshotDay();
    if(k==='r-s'){ const e=r.e, os=r.s; r.s=val; if(e!=null) r.e=fixEnd(r.s,e); linkStart(r,os); }
    else { const oe=r.e; r.e=fixEnd(r.s,val); linkEnd(r,oe); }
    sortItems(); commit([dayDoc(cur)]); renderSummary(); renderList();
  }
}

/* ---------- 시작 ---------- */
setInterval(()=>{ if(tab==='day'&&cur===todayKey()) renderSummary(); },30000);
renderDay();
window.SG={attachSync,detachSync,resetLocal,setStatus,setAccount:a=>{account=a; if(tab==='set') renderSet();}};
window.__sg={parse,state:()=>state,dayText};
})();
</script>
<script type="module">
/* ▼▼ Firebase 설정: 콘솔에서 복사한 firebaseConfig 내용을 여기에 ▼▼ */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBzfWkPQTvmaRL9sqVtiPRdtVmd-ZXuXBM",
  authDomain: "satuerdaynight-e00f7.firebaseapp.com",
  projectId: "satuerdaynight-e00f7",
  storageBucket: "satuerdaynight-e00f7.firebasestorage.app",
  messagingSenderId: "984115760645",
  appId: "1:984115760645:web:70bf86d68a816495d4566c"

/* ▲▲ ------------------------------------------------------------ ▲▲ */
const SG = window.SG; const $ = s => document.querySelector(s);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
if (!FIREBASE_CONFIG) {
  SG.setStatus('', '이 기기에만 저장 (동기화 설정 전)');
} else {
  const V = '10.12.4', base = 'https://www.gstatic.com/firebasejs/' + V + '/';
  try {
    const { initializeApp } = await import(base + 'firebase-app.js');
    const A = await import(base + 'firebase-auth.js');
    const F = await import(base + 'firebase-firestore.js');
    const app = initializeApp(FIREBASE_CONFIG);
    const auth = A.getAuth(app);
    let fs;
    try { fs = F.initializeFirestore(app, { localCache: F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() }) }); }
    catch (e) { fs = F.getFirestore(app); }
    const ERR = {
      'auth/invalid-credential': '이메일 또는 비밀번호가 맞지 않아요.', 'auth/wrong-password': '비밀번호가 맞지 않아요.',
      'auth/user-not-found': '가입되지 않은 이메일이에요. 아래 ‘처음이에요’를 눌러 가입하세요.',
      'auth/email-already-in-use': '이미 가입된 이메일이에요. 로그인해 주세요.', 'auth/weak-password': '비밀번호는 6자 이상이어야 해요.',
      'auth/invalid-email': '이메일 형식을 확인해 주세요.', 'auth/network-request-failed': '인터넷 연결을 확인해 주세요.',

    };
    const msg = (t, ok) => { const m = $('#lgMsg'); m.textContent = t || ''; m.className = 'msg' + (ok ? ' ok' : ''); };
    let signup = false;
    const setMode = () => { $('#lgGo').textContent = signup ? '가입하고 시작하기' : '로그인'; $('#lgMode').textContent = signup ? '이미 계정이 있어요 (로그인)' : '처음이에요 (가입하기)'; $('#lgPw').autocomplete = signup ? 'new-password' : 'current-password'; msg(''); };
    $('#lgMode').onclick = () => { signup = !signup; setMode(); };
    $('#lgReset').onclick = async () => {
      try { await A.sendPasswordResetEmail(auth, $('#lgEmail').value.trim()); msg('비밀번호 재설정 메일을 보냈어요. 메일함을 확인하세요.', true); }
      catch (e) { msg(ERR[e.code] || '메일을 보내지 못했어요.'); }
    };
    $('#loginForm').onsubmit = async ev => {
      ev.preventDefault(); const em = $('#lgEmail').value.trim(), pw = $('#lgPw').value;
